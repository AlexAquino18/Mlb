<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PropPulse — Player Prop Intelligence</title>
  <meta name="description" content="PropPulse — smart player prop edges for MLB, NFL, and CS2. Model-driven analysis and +EV odds." />
  <meta property="og:title" content="PropPulse" />
  <meta property="og:description" content="Player prop intelligence across MLB, NFL, and CS2." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Bebas+Neue&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/layout.css" />
</head>
<body class="home" data-billing="public">

<header id="header">
  <div id="header-inner">
    <a href="/" class="brand-link"><h1>PROPPULSE</h1></a>
    <div id="header-right">
      <form class="header-login" id="restore-form">
        <input type="email" id="restore-email" required placeholder="Email" autocomplete="email" />
        <button type="submit" class="btn">Log in</button>
      </form>
      <div id="billing-msg"></div>
    </div>
  </div>
</header>

<main id="main" class="home-main">
  <div class="sport-grid" id="sports">
    <a href="/mlb/" class="sport-card">
      <div class="sport-card-top">
        <div class="sport-card-icon" aria-hidden="true">⚾</div>
        <span class="tag tag-live">Live</span>
      </div>
      <div class="sport-card-name">MLB</div>
      <p class="sport-card-desc">Strikeouts, NRFI, hitters, +EV</p>
    </a>
    <a href="/nfl/" class="sport-card">
      <div class="sport-card-top">
        <div class="sport-card-icon" aria-hidden="true">🏈</div>
        <span class="tag tag-live">Live</span>
      </div>
      <div class="sport-card-name">NFL</div>
      <p class="sport-card-desc">Passing, rushing, receiving, +EV</p>
    </a>
    <a href="/cs2/" class="sport-card">
      <div class="sport-card-top">
        <div class="sport-card-icon" aria-hidden="true">🎯</div>
        <span class="tag tag-live">Live</span>
      </div>
      <div class="sport-card-name">CS2</div>
      <p class="sport-card-desc">PrizePicks vs Underdog gaps</p>
    </a>
    <a href="/nba/" class="sport-card soon-card">
      <div class="sport-card-top">
        <div class="sport-card-icon" aria-hidden="true">🏀</div>
        <span class="tag tag-soon">Soon</span>
      </div>
      <div class="sport-card-name">NBA</div>
      <p class="sport-card-desc">Points, rebounds, assists</p>
    </a>
  </div>
</main>

<footer id="site-footer">
  <div class="footer-inner">
    <p class="footer-disclaimer">For informational purposes only — not betting advice. Bet responsibly.</p>
  </div>
</footer>

<script src="/assets/billing.js"></script>
<script>
  const msg = document.getElementById("billing-msg");
  function setMsg(text, err) {
    if (!msg) return;
    msg.textContent = text || "";
    msg.classList.toggle("err", !!err);
  }
  document.getElementById("restore-form")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    setMsg("");
    const email = document.getElementById("restore-email").value;
    const j = await PropPulseBilling.call("restore", { email });
    if (j.ok && j.plan) {
      setMsg((j.plan === "ev" ? "+EV" : "Base") + " is on.");
      setTimeout(() => { location.href = "/mlb/"; }, 500);
    } else {
      setMsg(j.error === "no_active_subscription"
        ? "No active plan on that email."
        : (j.error || "Could not log in."), true);
    }
  });
  if (new URLSearchParams(location.search).get("billing") === "success") {
    PropPulseBilling.ready.then(() => setMsg("You're in."));
  }
</script>
</body>
</html>
